[package]
name = "beacon-split"
description = "Beacon Split — an agent-first development workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# Tauri builds the app as a library so the same code can back a desktop shell
# and, later, other frontends.
name = "beacon_split_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
beacon-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Called directly rather than through `WebviewWindow::set_effects`, which on
# macOS can only ever add an effect — passing it `None` removes nothing — and
# which discards the result, so a failure is silent. Both matter for a setting
# the user toggles.
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
