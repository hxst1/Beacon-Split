[package]
name = "beacon-split"
description = "Beacon Split — an agent-first development workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# Tauri builds the app as a library so the same code can back a desktop shell
# and, later, other frontends.
name = "beacon_split_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
beacon-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
