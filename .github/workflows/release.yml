# Builds and publishes a release when a version tag is pushed.
#
# Two things have to be true for an update to reach anyone: the artefact is
# built for their machine, and it is signed with the key their copy already
# trusts. Both happen here, so neither depends on somebody remembering.
name: Release

on:
  push:
    tags:
      - 'v*'

# The workflow writes releases; nothing else.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No version pinned here: `packageManager` in package.json already
      # names the exact one, and the action refuses to run when both say so.
      - uses: pnpm/action-setup@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # The daemon ships beside the application. Staged before bundling, and
      # named for the target it was built for, so a bundle can never pick up a
      # binary meant for another machine.
      - name: Build and stage the session daemon
        run: |
          cargo build --release -p beacon-daemon --target ${{ matrix.target }}
          mkdir -p src-tauri/binaries
          cp "target/${{ matrix.target }}/release/beacon-daemon" \
             "src-tauri/binaries/beacon-daemon-${{ matrix.target }}"

      # Everything must pass before anything is published: a release is the one
      # build nobody gets to try again.
      - name: Check
        run: pnpm check

      # The release page and the panel inside the application read the same
      # file, so they cannot disagree about what changed. It fails when the tag
      # has no entry, which is the only moment anyone would notice that a
      # version was about to ship with nothing to say for itself.
      - name: Render the release notes
        id: notes
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const version = process.env.GITHUB_REF_NAME.replace(/^v/, "")
            const release = JSON.parse(readFileSync("release-notes.json", "utf8"))
              .find((entry) => entry.version === version)
            if (!release) throw new Error(`release-notes.json has no entry for ${version}`)
            process.stdout.write([release.summary, "", ...release.changes.map((c) => `- ${c}`)].join("\n"))
          ' > notes.md
          {
            echo "body<<BEACON_NOTES_EOF"
            cat notes.md
            echo
            echo "BEACON_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update so an installed Beacon will accept it. Without
          # this the release still installs by hand, but nothing updates
          # itself.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # `--config` layers on `createUpdaterArtifacts`, which is off in the
          # committed configuration on purpose: with a public key present it
          # makes the private one mandatory, so turning it on there would stop
          # anyone without the signing key from building Beacon at all.
          args: --target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Beacon ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
