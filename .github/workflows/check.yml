# The same command contributors run locally, on every push and pull request.
#
# One job rather than several: the pieces are fast, and a single red mark is
# easier to act on than four.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Every platform Beacon is built for: a change that only compiles on the
    # machine it was written on is the commonest way to break the others.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri needs these to build at all on Linux, and a runner has none of
      # them. macOS and Windows ship their webview with the system.
      - name: Install the Linux webview and its build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No version pinned here: `packageManager` in package.json already
      # names the exact one, and the action refuses to run when both say so.
      - uses: pnpm/action-setup@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Some tests spawn real shells and a real daemon, which is the point of
      # them — a mock would not have caught what they caught.
      - run: pnpm check
