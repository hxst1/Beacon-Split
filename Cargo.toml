[workspace]
members = ["src-tauri", "crates/beacon-core", "crates/beacon-daemon"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"

[workspace.dependencies]
beacon-core = { path = "crates/beacon-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
